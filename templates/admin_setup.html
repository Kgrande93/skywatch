<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<title>{{ t.admin_setup_title }}</title>
<style>
  body{ font-family:system-ui,sans-serif; background:#0b0d10; color:#f2f5f7;
    display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
  .card{ background:#12161a; padding:32px; border-radius:12px; border:1px solid #242b31; width:340px; }
  h1{ font-size:17px; margin:0 0 8px; }
  p.sub{ font-size:13px; color:#8a94a0; margin:0 0 20px; line-height:1.5; }
  label{ display:block; font-size:13px; color:#8a94a0; margin-top:14px; }
  input{ width:100%; padding:9px 10px; margin-top:4px; background:#0e1216;
    border:1px solid #242b31; border-radius:6px; color:#f2f5f7; box-sizing:border-box; }
  button{ width:100%; margin-top:22px; padding:10px; background:#3ddc84; border:none;
    border-radius:6px; color:#0b0d10; font-weight:600; cursor:pointer; }
  .error{ color:#ff4d4d; font-size:13px; margin-top:14px; }
</style>
</head>
<body>
<div class="card">
  <h1>{{ t.admin_setup_title }}</h1>
  <p class="sub">{{ t.admin_setup_body }}</p>
  <form method="post">
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <label>{{ t.admin_new_password }}</label>
    <input type="password" name="new_password" required minlength="8" autofocus>
    <label>{{ t.admin_confirm_password }}</label>
    <input type="password" name="confirm_password" required minlength="8">
    <button type="submit">{{ t.admin_setup_button }}</button>
  </form>
</div>
</body>
</html>
