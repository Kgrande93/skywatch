<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skywatch</title>
<style>
  :root {
    --muted: #999;
    --accent: #00d4f0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
  }
  body {
    background: #000;
    color: #fff;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    user-select: none;
    -webkit-user-select: none;
  }
  .page {
    display: flex;
    flex-direction: column;
    height: 100%;
    width: 100%;
    padding: clamp(12px, 2.2vh, 26px) clamp(14px, 2.5vw, 36px);
    gap: clamp(8px, 1.6vh, 20px);
  }
  .top-row, .bottom-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: clamp(12px, 3vw, 40px);
    flex-wrap: wrap;
  }
  .bottom-row {
    align-items: flex-end;
  }
  .main-area {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
  }
  .card {
    max-width: 1600px;
    width: 100%;
  }
  .top-status-stack {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: 46vw;
  }
  .top-status {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .status-dot {
    width: clamp(7px, 0.9vw, 14px);
    height: clamp(7px, 0.9vw, 14px);
    border-radius: 50%;
    flex-shrink: 0;
  }
  .status-dot.live { background: #37e07a; box-shadow: 0 0 8px #37e07a; }
  .status-dot.idle { background: var(--muted); }
  .status-dot.error { background: #ff4d4d; box-shadow: 0 0 8px #ff4d4d; }
  .source-dot {
    display: inline-block; width: 0.5em; height: 0.5em; border-radius: 50%;
    margin-right: 0.4em; vertical-align: middle;
  }
  .source-dot.adsb { background: #37e07a; box-shadow: 0 0 6px #37e07a; }
  .source-dot.mode_s { background: #ffb454; box-shadow: 0 0 6px #ffb454; }
  .status-label {
    font-size: clamp(10px, 1.1vw, 16px);
    letter-spacing: 0.02em;
    color: var(--muted);
    opacity: 0.8;
  }
  .corner-label {
    font-size: clamp(10px, 1.1vw, 16px);
    color: var(--muted);
    opacity: 0.8;
    letter-spacing: 0.02em;
    max-width: 32vw;
    line-height: 1.4;
    overflow-wrap: break-word;
  }
  .corner-label.top-right {
    text-align: right;
  }
  .corner-label.bottom-left {
    text-align: left;
  }
  .corner-label.bottom-right {
    text-align: right;
  }
  @media (max-width: 480px) and (max-height: 500px) {
    .corner-label, .top-status-stack { display: none; }
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(20px, 4vw, 64px);
    text-align: left;
    width: 100%;
    min-height: clamp(56px, 8.8vw, 160px);
  }
  .header > div:last-child {
    width: clamp(220px, 42vw, 760px);
    flex-shrink: 0;
  }
  .logo-box {
    width: clamp(140px, 22vw, 400px);
    height: clamp(56px, 8.8vw, 160px);
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
    padding: 8px 16px;
  }
  .logo-box.has-logo {
    background: #fff;
  }
  .logo-box img {
    height: 62%;
    width: auto;
    max-width: 92%;
    object-fit: contain;
  }
  .logo-box .no-logo-text {
    font-size: clamp(11px, 1.6vw, 22px);
    color: var(--muted);
    opacity: 0.7;
    text-align: center;
    padding: 0 8px;
  }
  .flight-number {
    font-size: clamp(28px, 6vw, 90px);
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.5px;
    line-height: 1.1;
    overflow-wrap: break-word;
    min-height: 1.1em;
  }
  .flag-icon {
    font-size: 0.4em;
    vertical-align: middle;
  }
  .airline-name {
    font-size: clamp(15px, 3vw, 46px);
    color: var(--muted);
    margin-top: 6px;
    height: 1.3em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .reg-type {
    font-size: clamp(13px, 2.2vw, 34px);
    color: var(--muted);
    opacity: 0.75;
    margin-top: 2px;
    height: 1.3em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .divider {
    height: 1px;
    background: rgba(255,255,255,0.12);
    margin: clamp(22px, 5vh, 72px) 0;
  }
  .route {
    font-size: clamp(18px, 3.6vw, 56px);
    color: #fff;
    text-align: center;
    height: 1.3em;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .route-missing {
    font-size: clamp(14px, 2.4vw, 36px);
    color: var(--muted);
    opacity: 0.7;
  }
  .status-line {
    font-size: clamp(15px, 2.6vw, 40px);
    color: var(--muted);
    margin-top: 6px;
    text-align: center;
  }
  .metrics {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(14px, 5vh, 40px) clamp(24px, 6vw, 100px);
    margin-top: clamp(22px, 5vh, 72px);
  }
  .metrics > div {
    width: clamp(80px, 15vw, 240px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .metric-value {
    font-size: clamp(20px, 4vw, 64px);
    font-weight: 600;
    color: #fff;
    text-align: center;
    white-space: nowrap;
  }
  .metric-label { font-size: clamp(11px, 1.8vw, 28px); color: var(--muted); text-transform: uppercase; margin-top: 6px; text-align: center; }
  .idle-text {
    font-size: clamp(17px, 3.6vw, 52px);
    color: #fff;
    line-height: 1.6;
    text-align: center;
  }
  .idle-text strong { color: var(--accent); }
  .empty { color: var(--muted); font-size: clamp(15px, 2.4vw, 36px); text-align: center; }
  .nav-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 3vw, 32px);
    margin-top: clamp(24px, 5vh, 64px);
  }
  .nav-arrow {
    display: none;
    background: rgba(255,255,255,0.08);
    border: none;
    color: #fff;
    width: clamp(28px, 3vw, 44px);
    height: clamp(28px, 3vw, 44px);
    border-radius: 50%;
    font-size: clamp(14px, 1.8vw, 22px);
    cursor: pointer;
    line-height: 1;
  }
  .nav-arrow:hover { background: rgba(255,255,255,0.16); }
  .nav-arrow.visible { display: block; }
  .nav-arrow { flex-shrink: 0; }
  .dots {
    display: flex;
    justify-content: center;
    gap: 10px;
    max-width: 55vw;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .dots::-webkit-scrollbar { display: none; }
  .dot { flex-shrink: 0; }
  .dot { width: clamp(6px, 1vw, 16px); height: clamp(6px, 1vw, 16px); border-radius: 50%; background: rgba(255,255,255,0.2); cursor: pointer; }
  .dot.on { background: var(--accent); }
  .emergency-banner {
    background: #b00000;
    color: #fff;
    font-weight: 700;
    text-align: center;
    padding: clamp(10px, 1.6vh, 20px);
    border-radius: 8px;
    margin-bottom: clamp(16px, 3vh, 32px);
    font-size: clamp(15px, 2.4vw, 38px);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    animation: emergency-pulse 1.2s infinite;
  }
  @keyframes emergency-pulse {
    0%, 100% { background: #b00000; }
    50% { background: #ff2020; }
  }
  .rotate-progress-track {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 3px;
    background: rgba(255,255,255,0.06);
    display: none;
  }
  .rotate-progress-track.visible { display: block; }
  .rotate-progress-bar {
    height: 100%;
    width: 100%;
    background: rgba(255,255,255,0.25);
  }
  .snow-layer, .fireworks-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
    display: none;
  }
  .snow-layer.visible, .fireworks-layer.visible { display: block; }
  .snowflake {
    position: absolute;
    top: -10px;
    background: #fff;
    border-radius: 50%;
    animation: snowfall linear infinite;
  }
  @keyframes snowfall {
    from { transform: translateY(-10px); }
    to { transform: translateY(110vh); }
  }
  .firework-burst {
    position: absolute;
    width: 3px;
    height: 3px;
  }
  .firework-burst span {
    position: absolute;
    left: 0;
    top: 0;
    width: 3px;
    height: 22px;
    background: currentColor;
    border-radius: 2px;
    transform-origin: 1.5px 1.5px;
    opacity: 0;
    animation: firework-spark 1.4s ease-out infinite;
  }
  @keyframes firework-spark {
    0% { opacity: 0; height: 2px; }
    15% { opacity: 1; }
    100% { opacity: 0; height: 60px; }
  }
  .page, .rotate-progress-track {
    position: relative;
    z-index: 1;
  }
  .ntfy-banner {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: none; padding: 14px 24px; background: rgba(255,180,84,0.14);
    border-top: 2px solid #ffb454; color: #ffb454;
    font-size: 1.2rem; font-weight: 600; text-align: center;
  }
  .ntfy-banner.show { display: block; }
</style>
</head>

<body>
  <div id="snowLayer" class="snow-layer"></div>
  <div id="fireworksLayer" class="fireworks-layer"></div>
  <div class="page">
    <div class="top-row">
      <div class="top-status-stack">
        <div class="top-status">
          <span id="antennaDot" class="status-dot idle"></span>
          <span id="antennaLabel" class="status-label">{{ t.connecting_to_antenna }}</span>
        </div>
        <div class="top-status">
          <span id="statusDot" class="status-dot idle"></span>
          <span id="statusLabel" class="status-label">Connecting …</span>
        </div>
      </div>
    </div>

    <div class="main-area">
      <div class="card">
        <div id="content"></div>
        <div id="navRow" class="nav-row">
          <button id="prevBtn" class="nav-arrow" onclick="navigatePrev()" aria-label="Previous aircraft">&#8249;</button>
          <div id="dots" class="dots"></div>
          <button id="nextBtn" class="nav-arrow" onclick="navigateNext()" aria-label="Next aircraft">&#8250;</button>
        </div>
      </div>
    </div>

    <div class="bottom-row">
      <div class="corner-label bottom-left"></div>
      <div class="corner-label bottom-right">Made by love in Nannestad, Norway &#127475;&#127476;</div>
    </div>
  </div>
  <div id="rotateProgressTrack" class="rotate-progress-track">
    <div id="rotateProgressBar" class="rotate-progress-bar"></div>
  </div>
  <div id="ntfyBanner" class="ntfy-banner"></div>

<script>
const T = {{ t | tojson }};
const ROTATE_MS = 10000;
let currentList = [];
let currentHex = null;

const PLANE_ICON_SVG = '<span class="no-logo-text">Logo missing</span>';
const SLEIGH_ICON_SVG = '<svg width="70" height="46" viewBox="0 0 70 46"><path d="M8 34 Q6 20 20 18 L46 18 Q58 18 60 30 L60 34 Z" fill="#b00000" stroke="#7a0000" stroke-width="1.5"/><circle cx="18" cy="38" r="5" fill="#333"/><circle cx="50" cy="38" r="5" fill="#333"/><path d="M6 34 Q2 34 2 30" stroke="#7a0000" stroke-width="2" fill="none"/></svg>';

function handleLogoFailure(imgEl) {
  const box = imgEl.closest('.logo-box');
  if (box) {
    box.classList.remove('has-logo');
    box.innerHTML = PLANE_ICON_SVG;
  }
}

function handleLogoLoad(imgEl) {
  // Some APIs return a 200 OK with empty/invalid image data instead of a
  // real HTTP error when a code isn't found - onerror never fires for that,
  // so double-check the image actually decoded to real pixels.
  if (imgEl.naturalWidth === 0) handleLogoFailure(imgEl);
}

function fmtTime(epochSeconds) {
  const d = new Date(epochSeconds * 1000);
  return d.toLocaleTimeString('no-NO', { hour: '2-digit', minute: '2-digit' });
}

function flightLabel(ac) {
  return ac.flight_iata || ac.flight_icao || ac.callsign || 'Unknown';
}

function isoToFlagEmoji(iso) {
  if (!iso || iso.length !== 2) return '';
  const codePoints = [...iso.toUpperCase()].map(c => 127397 + c.charCodeAt(0));
  return String.fromCodePoint(...codePoints);
}

const EMERGENCY_SQUAWKS = {
  '7500': 'HIJACKING (SQUAWK 7500)',
  '7600': 'RADIO FAILURE (SQUAWK 7600)',
  '7700': 'EMERGENCY (SQUAWK 7700)',
};

// readsb's own 'emergency' field is more specific than just the squawk code
const EMERGENCY_TYPES = {
  'general': 'MAYDAY - GENERAL EMERGENCY',
  'lifeguard': 'MEDICAL EMERGENCY (PAN PAN)',
  'minfuel': 'FUEL EMERGENCY',
  'nordo': 'RADIO FAILURE (NORDO)',
  'unlawful': 'HIJACKING',
  'downed': 'EMERGENCY LANDING/DOWNED',
};

function emergencyLabel(ac) {
  if (ac.emergency && EMERGENCY_TYPES[ac.emergency]) return EMERGENCY_TYPES[ac.emergency];
  if (ac.emergency) return `EMERGENCY (${ac.emergency.toUpperCase()})`;
  if (ac.squawk && EMERGENCY_SQUAWKS[ac.squawk]) return EMERGENCY_SQUAWKS[ac.squawk];
  return null;
}

function airportLabel(ap) {
  if (!ap) return null;
  const code = ap.iata_code;
  const city = ap.municipality;
  if (!code) return city || ap.name || null;
  if (!city) return code;
  const country = ap.country_name && ap.country_name !== "Norway" ? ap.country_name : null;
  return country ? `${code} (${city}, ${country})` : `${code} (${city})`;
}

function renderActive(ac) {
  const origin = airportLabel(ac.origin);
  const dest = airportLabel(ac.destination);
  const sameAirport = ac.origin && ac.destination && ac.origin.iata_code === ac.destination.iata_code;
  let routeLine = null;
  if (sameAirport) routeLine = null;
  else if (origin && dest) routeLine = `${origin} &rarr; ${dest}`;
  else if (dest) routeLine = `til ${dest}`;

  let html = '';
  const emergency = emergencyLabel(ac);
  if (emergency) {
    html += `<div class="emergency-banner">&#9888; ${emergency}</div>`;
  }

  html += '<div class="header">';
  if (ac.is_santa) {
    html += `<div class="logo-box has-logo">${SLEIGH_ICON_SVG}</div>`;
  } else if (ac.airline_logo) {
    html += `<div class="logo-box has-logo"><img src="${ac.airline_logo}" alt="${ac.airline_name || ''}" onerror="handleLogoFailure(this)" onload="handleLogoLoad(this)"></div>`;
  } else {
    html += `<div class="logo-box">${PLANE_ICON_SVG}</div>`;
  }
  html += '<div>';
  html += `<div class="flight-number" id="flightNumberEl">${flightLabel(ac)}</div>`;
  const nameParts = [];
  if (ac.airline_name) nameParts.push(ac.airline_name);
  if (ac.operator_country) nameParts.push(ac.operator_country);
  const nameLine = nameParts.join(' · ');
  html += `<div class="airline-name">${nameLine}</div>`;
  const flag = isoToFlagEmoji(ac.registration_country_iso);
  const regWithFlag = flag && ac.registration ? `${flag} ${ac.registration}` : ac.registration;
  let typeLabel = null;
  if (ac.is_military) typeLabel = 'Military aircraft';
  else if (ac.category_label && (ac.category_always_show || !ac.airline_name)) typeLabel = ac.category_label;
  const regType = [regWithFlag, ac.aircraft_type, typeLabel].filter(Boolean).join(' · ');
  html += `<div class="reg-type">${regType}</div>`;
  // ADS-B is the default/common case - only call out the exception (Mode S,
  // the reason altitude might be missing) instead of labeling every aircraft.
  if (ac.position_source === 'mode_s') {
    html += `<div class="reg-type"><span class="source-dot mode_s" title="${T.unknown_altitude_tooltip}"></span>Mode S</div>`;
  }
  html += '</div>';
  html += '</div>';

  html += '<div class="divider"></div>';
  html += `<div class="route">${routeLine || '<span class="route-missing">Route unknown</span>'}</div>`;

  let altStr, gsStr, distStr;
  if (ac.landed) {
    altStr = `Landet ${fmtTime(ac.landed_at_epoch)}`;
    gsStr = '–';
    distStr = '–';
  } else {
    altStr = ac.altitude_ft != null ? `${Math.round(ac.altitude_ft)} ft` : T.unknown_altitude;
    if (ac.altitude_ft != null && ac.vertical_rate_fpm != null) {
      if (ac.vertical_rate_fpm > 150) altStr += ' &#8593;';
      else if (ac.vertical_rate_fpm < -150) altStr += ' &#8595;';
      else altStr += ' &#8594;';
    }
    gsStr = ac.groundspeed_kt != null ? `${Math.round(ac.groundspeed_kt)} kt` : '–';
    distStr = ac.distance_km != null ? `${ac.distance_km} km` : '–';
  }
  const squawkStr = ac.squawk || '–';
  const squawkIsEmergency = ac.squawk && EMERGENCY_SQUAWKS[ac.squawk];
  const squawkStyle = squawkIsEmergency ? ' style="color:#ff3b3b;font-weight:800;"' : '';
  html += '<div class="metrics">';
  const altTitle = (ac.altitude_ft == null) ? ` title="${T.unknown_altitude_tooltip}"` : '';
  html += `<div><div class="metric-value"${altTitle}>${altStr}</div><div class="metric-label">${T.stat_altitude}</div></div>`;
  html += `<div><div class="metric-value">${gsStr}</div><div class="metric-label">${T.stat_speed}</div></div>`;
  html += `<div><div class="metric-value">${distStr}</div><div class="metric-label">${T.stat_distance}</div></div>`;
  html += `<div><div class="metric-value"${squawkStyle}>${squawkStr}</div><div class="metric-label">${T.stat_squawk}</div></div>`;
  html += '</div>';

  document.getElementById('content').innerHTML = html;
}

function renderDots() {
  const dotsEl = document.getElementById('dots');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  if (currentList.length <= 1) {
    dotsEl.innerHTML = '';
    prevBtn.classList.remove('visible');
    nextBtn.classList.remove('visible');
    return;
  }
  prevBtn.classList.add('visible');
  nextBtn.classList.add('visible');
  dotsEl.innerHTML = currentList.map((ac) =>
    `<span class="dot ${ac.hex === currentHex ? 'on' : ''}" onclick="goToHex('${ac.hex}')"></span>`).join('');
}

function goToHex(hex) {
  if (!currentList.find(a => a.hex === hex)) return;
  currentHex = hex;
  showCurrent();
  restartProgressBar();
}

function navigatePrev() {
  if (currentList.length < 2) return;
  const idx = currentList.findIndex(a => a.hex === currentHex);
  const prevIdx = idx <= 0 ? currentList.length - 1 : idx - 1;
  goToHex(currentList[prevIdx].hex);
}

function navigateNext() {
  if (currentList.length < 2) return;
  const idx = currentList.findIndex(a => a.hex === currentHex);
  const nextIdx = idx === -1 ? 0 : (idx + 1) % currentList.length;
  goToHex(currentList[nextIdx].hex);
}

function updateProgressVisibility() {
  const track = document.getElementById('rotateProgressTrack');
  if (!track) return;
  if (currentList.length > 1) track.classList.add('visible');
  else track.classList.remove('visible');
}

function restartProgressBar() {
  const bar = document.getElementById('rotateProgressBar');
  if (!bar) return;
  updateProgressVisibility();
  if (currentList.length <= 1) return;
  bar.style.transition = 'none';
  bar.style.width = '100%';
  void bar.offsetWidth; // force reflow so the transition below actually restarts
  bar.style.transition = `width ${ROTATE_MS}ms linear`;
  bar.style.width = '0%';
}

function findEmergencyHex(list) {
  const found = list.find(ac => emergencyLabel(ac));
  return found ? found.hex : null;
}

function showCurrent() {
  if (currentList.length === 0) return;
  let ac = currentList.find(a => a.hex === currentHex);
  if (!ac) {
    // currently shown plane is gone (left range) - fall back to the first
    // one in the (stable, hex-sorted) list rather than waiting for a tick
    ac = currentList[0];
    currentHex = ac.hex;
  }
  renderActive(ac);
  renderDots();
}

function updateList(list) {
  const wasRotating = currentList.length > 1;
  currentList = list;

  const emergencyHex = findEmergencyHex(list);
  if (emergencyHex) {
    // Lock onto the emergency aircraft regardless of normal rotation -
    // easy to keep an eye on it instead of it rotating away.
    currentHex = emergencyHex;
    showCurrent();
    document.getElementById('rotateProgressTrack').classList.remove('visible');
    return;
  }

  showCurrent();
  const isRotatingNow = currentList.length > 1;
  if (!wasRotating && isRotatingNow) {
    restartProgressBar();
  } else {
    updateProgressVisibility();
  }
}

// Runs continuously from page load, independent of polling/data changes -
// this way list refreshes every 5s don't affect which plane is shown or
// when the next switch happens; only this timer decides that.
setInterval(() => {
  if (currentList.length > 1) {
    if (findEmergencyHex(currentList)) return; // locked - don't rotate away from an emergency
    const idx = currentList.findIndex(a => a.hex === currentHex);
    const nextIdx = idx === -1 ? 0 : (idx + 1) % currentList.length;
    currentHex = currentList[nextIdx].hex;
    showCurrent();
    restartProgressBar();
  }
}, ROTATE_MS);

function render(data) {
  const antennaDot = document.getElementById('antennaDot');
  const antennaLabel = document.getElementById('antennaLabel');
  const SOURCE_LABEL_KEYS = { local: 'source_local', opensky_own: 'source_opensky_own', opensky_all: 'source_opensky_all' };

  const banner = document.getElementById('ntfyBanner');
  if (data.banner_text) {
    banner.textContent = data.banner_text;
    banner.classList.add('show');
  } else {
    banner.classList.remove('show');
  }
  if (data.antenna_connected) {
    antennaDot.className = 'status-dot live';
    antennaLabel.textContent = T.antenna_connected_prefix + ': ' + (T[SOURCE_LABEL_KEYS[data.data_source]] || 'Antenna');
  } else {
    antennaDot.className = 'status-dot error';
    antennaLabel.textContent = T.no_antenna_connection;
  }

  const dot = document.getElementById('statusDot');
  const label = document.getElementById('statusLabel');
  const content = document.getElementById('content');

  if (data.active && data.aircraft_list && data.aircraft_list.length > 0) {
    dot.className = 'status-dot live';
    label.textContent = T.tracking_aircraft.replace('{count}', data.aircraft_list.length);
    updateList(data.aircraft_list);

  } else if (data.last) {
    currentList = [];
    currentHex = null;
    document.getElementById('dots').innerHTML = '';
    document.getElementById('rotateProgressTrack').classList.remove('visible');
    const ac = data.last;
    dot.className = 'status-dot idle';
    label.textContent = T.no_aircraft_nearby;

    const dest = airportLabel(ac.destination);
    const seenTime = fmtTime(ac.seen_epoch);
    let etaHtml = '';
    if (ac.eta && !ac.eta.landed_estimate) {
      etaHtml = ` &mdash; ${T.estimated_landing_around} <strong>${fmtTime(ac.eta.epoch)}</strong>`;
    } else if (ac.eta && ac.eta.landed_estimate) {
      etaHtml = ` &mdash; ${T.likely_landed_around} <strong>${seenTime}</strong>`;
    }

    let html = '<div class="header">';
    if (ac.airline_logo) {
      html += `<div class="logo-box has-logo"><img src="${ac.airline_logo}" alt="${ac.airline_name || ''}" onerror="handleLogoFailure(this)" onload="handleLogoLoad(this)"></div>`;
    } else {
      html += `<div class="logo-box">${PLANE_ICON_SVG}</div>`;
    }
    html += '<div>';
    html += `<div class="flight-number">${flightLabel(ac)}</div>`;
    if (ac.airline_name) html += `<div class="airline-name">${ac.airline_name}</div>`;
    html += '</div>';
    html += '</div>';
    html += '<div class="divider"></div>';
    html += `<div class="idle-text">${T.last_aircraft_seen}`;
    if (dest) html += ` ${T.heading_to} <strong>${dest}</strong>`;
    html += `, at ${seenTime}${etaHtml}.</div>`;
    content.innerHTML = html;

  } else {
    currentList = [];
    currentHex = null;
    document.getElementById('rotateProgressTrack').classList.remove('visible');
    dot.className = 'status-dot idle';
    label.textContent = T.no_data_yet;
    content.innerHTML = `<div class="empty">${T.waiting_for_first_aircraft}</div>`;
  }
}

let snowGenerated = false;
function updateSnow(show) {
  const layer = document.getElementById('snowLayer');
  if (show) {
    layer.classList.add('visible');
    if (!snowGenerated) {
      for (let i = 0; i < 60; i++) {
        const flake = document.createElement('div');
        const size = 2 + Math.random() * 3;
        flake.className = 'snowflake';
        flake.style.left = `${Math.random() * 100}%`;
        flake.style.width = `${size}px`;
        flake.style.height = `${size}px`;
        flake.style.opacity = (0.25 + Math.random() * 0.5).toFixed(2);
        flake.style.animationDuration = `${8 + Math.random() * 8}s`;
        flake.style.animationDelay = `${Math.random() * 10}s`;
        layer.appendChild(flake);
      }
      snowGenerated = true;
    }
  } else {
    layer.classList.remove('visible');
  }
}

let fireworksGenerated = false;
function updateFireworks(show) {
  const layer = document.getElementById('fireworksLayer');
  if (show) {
    layer.classList.add('visible');
    if (!fireworksGenerated) {
      const colors = ['#ffb000', '#ff4d6d', '#37e0c8', '#c98bff', '#ffe066'];
      for (let i = 0; i < 6; i++) {
        const burst = document.createElement('div');
        burst.className = 'firework-burst';
        burst.style.left = `${10 + Math.random() * 80}%`;
        burst.style.top = `${10 + Math.random() * 60}%`;
        burst.style.color = colors[i % colors.length];
        const rays = 8;
        for (let r = 0; r < rays; r++) {
          const spark = document.createElement('span');
          spark.style.transform = `rotate(${(360 / rays) * r}deg)`;
          spark.style.animationDelay = `${Math.random() * 1.4}s`;
          burst.appendChild(spark);
        }
        layer.appendChild(burst);
      }
      fireworksGenerated = true;
    }
  } else {
    layer.classList.remove('visible');
  }
}

async function poll() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();
    render(data);
    updateSnow(!!data.show_snow);
    updateFireworks(!!data.show_fireworks);
  } catch (e) {
    document.getElementById('antennaDot').className = 'status-dot error';
    document.getElementById('antennaLabel').textContent = T.no_server_connection;
    document.getElementById('statusDot').className = 'status-dot idle';
    document.getElementById('statusLabel').textContent = 'Connection lost';
  }
}

poll();
setInterval(poll, 1000);

// Keep the screen from sleeping on devices/browsers that support it
// (Chrome/Android/ChromeOS). Re-request if the tab regains visibility,
// since the lock is released automatically when it's hidden.
async function requestWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try {
    await navigator.wakeLock.request('screen');
  } catch (e) {
    // ignore - not fatal, just means the screen might sleep on its own
  }
}
requestWakeLock();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') requestWakeLock();
});
</script>
